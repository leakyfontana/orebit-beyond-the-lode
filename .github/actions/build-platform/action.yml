name: Build Orebit platform
description: Build a pinned native backend and an isolated Godot beta export.
inputs:
  platform:
    required: true
    description: Release platform identifier.
  validation:
    required: true
    description: Whether outputs are validation-only and use disposable Android signing.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install SCons
      shell: bash
      run: python -m pip install scons==4.9.1
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      if: inputs.platform == 'android-arm64'
      with:
        distribution: temurin
        java-version: '17'
    - name: Install matching Android toolchains
      if: inputs.platform == 'android-arm64'
      shell: bash
      run: |
        sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'ndk;28.1.13356709'
    - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      if: inputs.platform == 'web'
      with:
        version: '6.0.13'
    - name: Restore preserved Android signing identity
      if: inputs.platform == 'android-arm64' && inputs.validation == 'false'
      shell: bash
      run: |
        python - <<'PY'
        import base64, os
        from pathlib import Path
        key = Path(os.environ['RUNNER_TEMP']) / 'orebit-beta.keystore'
        key.write_bytes(base64.b64decode(os.environ['OREBIT_ANDROID_KEYSTORE_BASE64'], validate=True))
        key.chmod(0o600)
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write('OREBIT_ANDROID_KEYSTORE=' + str(key) + '\n')
        PY
    - name: Build from source
      shell: bash
      env:
        OREBIT_PLATFORM: ${{ inputs.platform }}
        OREBIT_VALIDATION: ${{ inputs.validation }}
      run: |
        python - <<'PY'
        import os, subprocess, sys
        command = [sys.executable, 'automation/release/build.py', '--platform', os.environ['OREBIT_PLATFORM'], '--sha', os.environ['GITHUB_SHA'], '--run-number', os.environ['GITHUB_RUN_NUMBER'], '--jobs', '3']
        if os.environ['OREBIT_VALIDATION'] == 'true':
            command.append('--validation')
        subprocess.run(command, check=True)
        PY
    - name: Exercise Web export to its menu
      if: inputs.platform == 'web'
      shell: bash
      env:
        OREBIT_VALIDATION: ${{ inputs.validation }}
      run: |
        python -m pip install playwright==1.56.0
        python -m playwright install --with-deps chromium
        python - <<'PY'
        import os, subprocess, sys
        from pathlib import Path
        root = Path('dist/validation/web' if os.environ['OREBIT_VALIDATION'] == 'true' else 'dist/web')
        archives = list(root.glob('*.zip'))
        if len(archives) != 1:
            raise SystemExit('Expected exactly one Web export archive')
        subprocess.run([sys.executable, 'automation/release/smoke_web.py', '--zip', str(archives[0]), '--sha', os.environ['GITHUB_SHA'], '--screenshot', 'dist/web-menu.png'], check=True)
        PY
    - name: Remove runner signing material
      if: always() && inputs.platform == 'android-arm64' && inputs.validation == 'false'
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        (Path(os.environ['RUNNER_TEMP']) / 'orebit-beta.keystore').unlink(missing_ok=True)
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: beta-${{ inputs.validation == 'true' && 'validation' || 'production' }}-${{ inputs.platform }}
        path: dist/
        if-no-files-found: error
        retention-days: 14
