# Included only by the play.arcmonkeyswelding.com HTTPS server block.
# No upload, execution, directory listing, or authenticated write endpoint.
location ^~ /__orebit_deployment__/ {
    alias /srv/motherload/status/;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    autoindex off;
    limit_except GET HEAD { deny all; }
}
