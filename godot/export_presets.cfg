[preset.2]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,animations/controllers/*.tres,animations/clips/*.tres"
exclude_filter="data/unity_manifest.json,exports/*,android/*,tools/*,*.import,*.keystore,*.jks,*.pem,*.key,*.env,*.cs,*.meta,*.py,*.ps1,*.sh"
export_path="exports/web/index.html"
encrypt_pck=false
encrypt_directory=false

[preset.2.options]
custom_template/debug="../verification/tools/export_templates/templates/web_dlink_nothreads_debug.zip"
custom_template/release="../verification/tools/export_templates/templates/web_dlink_nothreads_release.zip"
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script>(() => { const anchor = () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }; window.addEventListener('pageshow', anchor); window.addEventListener('resize', anchor); window.addEventListener('scroll', anchor, { passive: true }); window.visualViewport?.addEventListener('resize', anchor); window.visualViewport?.addEventListener('scroll', anchor, { passive: true }); anchor(); })();</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/display=1
progressive_web_app/orientation=1

